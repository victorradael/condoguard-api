name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned by commit SHA (tag in the comment);
# Dependabot (.github/dependabot.yml) proposes the updates.

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # No password on purpose: ephemeral CI service, reachable only by this job.
      redis:
        image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: sqlc generated code is up to date
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff

      - name: Tests (unit + PostgreSQL + Redis + end-to-end security)
        run: go test ./... -race -count=1

      - name: Migrations up/down from scratch
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate reset
          go run ./cmd/migrate up

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Fails on any vulnerability reachable from our code (stdlib included).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t condoguard-api:ci .

      - name: Runs as non-root and becomes healthy
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' condoguard-api:ci)" = "10001:10001"
          docker run -d --name api -e JWT_SECRET_KEY="$(openssl rand -base64 32)" condoguard-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs api
          echo "container did not become healthy (last status: $status)"
          exit 1

      - name: Refuses to start without a JWT secret
        run: |
          if docker run --rm condoguard-api:ci; then
            echo "the API must not start without JWT_SECRET_KEY"
            exit 1
          fi
