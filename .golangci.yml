version: "2"
run:
  tests: true
linters:
  enable:
    - misspell
    - prealloc
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false # explicit `_ =` is the codebase idiom for ignored writes
    govet:
      enable-all: true
      disable:
        # Reordering fields would change the JSON field order of the API.
        - fieldalignment
    misspell:
      # The domain vocabulary is Portuguese ("Momento", ...).
      ignore-rules:
        - momento
        - validade
        - autor
        - dependente
        - residencial
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
